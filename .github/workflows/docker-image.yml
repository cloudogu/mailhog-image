name: Push image
on:
  schedule:
    # Rebuild once a week
    - cron:  '0 0 * * 0'
  push:
    branches: [ main ]

  # Allow running this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout image repo
        uses: actions/checkout@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download latest MailHog release
        run: |
          # Find latest release 
          VERSION="$( curl -s -H "Authorization: bearer ${{ secrets.GITHUB_TOKEN }}"  "https://api.github.com/repos/mailhog/mailhog/releases/latest" | jq -r '.tag_name')"
          VERSION_DATE="$VERSION-$(date +'%Y-%m-%d')"
          
          GHCR_IMAGE=ghcr.io/${{ github.repository_owner }}/mailhog
          TAGS="${GHCR_IMAGE}:latest,${GHCR_IMAGE}:${VERSION},${GHCR_IMAGE}:${VERSION_DATE}"
          echo "TAGS=${TAGS}" | tee -a $GITHUB_ENV
          echo "VERSION=${VERSION}" | tee -a $GITHUB_ENV
          echo "BUILD_DATE=$(date +'%Y-%m-%d %H:%M:%S')" | tee -a $GITHUB_ENV
          echo "GIT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" | tee -a $GITHUB_ENV
          echo "GIT_REF=$(git symbolic-ref -q --short HEAD || git describe --tags --exact-match)" | tee -a $GITHUB_ENV
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: VERSION=${{ env.VERSION }}
          push: true
          tags: ${{ env.TAGS }}
          labels: |
            org.opencontainers.image.authors=${{ github.repository_owner }}
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
            org.opencontainers.image.description=Created from commit ${{ env.GIT_SHA }} and ref ${{ env.GIT_REF }}
            org.opencontainers.image.ref.name=${{ env.GIT_REF }}
            org.opencontainers.image.revision=${{ env.GIT_SHA }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}   

  notify_failure:
    runs-on: ubuntu-latest
    needs: build:
    permissions:
      issues: write
      contents: read
    if: failure()
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Manage issue
        id: manage_issue
        run: |
          ISSUE_TITLE="[Workflow Log] Central error logging"
          ISSUE_DATA=$(gh issue list -R "$GITHUB_REPOSITORY" --search "is:open in:title \"${ISSUE_TITLE}\"" --json number --limit 1)
          ISSUE_NUMBER=$(echo "$ISSUE_DATA" | jq -r '.[0].number')
          
          if [ -z "$ISSUE_NUMBER" ] || [ "$ISSUE_NUMBER" = "null" ]; then
            NEW_ISSUE_NUMBER=$(gh issue create -R "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" \
                                               --body "This issue serves as a central log for all workflow errors." \
                                                | sed -n 's/.*#\([0-9]\+\).*/\1/p')
            echo "issue_number=$NEW_ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          else              
            echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          fi                   

      - name: Create comment
        id: create_comment
        run: |
          if [ -z "${{ steps.manage_issue.outputs.issue_number }}" ] || [ "${{ steps.manage_issue.outputs.issue_number }}" = "null" ]; then
            echo "Issue number not found!"
            exit 1
          else
            gh issue comment ${{ steps.manage_issue.outputs.issue_number }} -R "$GITHUB_REPOSITORY" --body "***Workflow failure*** ([View workflow run for details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))"
          fi
